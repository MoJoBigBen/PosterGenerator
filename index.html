<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="controls">
    <h1>Album-Poster</h1>

    <label class="drop" id="drop">
      <input type="file" id="coverFile" accept="image/*" hidden>
      <span id="dropText">Cover hier ablegen, einfügen oder klicken</span>
    </label>

    <div class="field">
      <label for="title">Titel</label>
      <input id="title" type="text">
    </div>
    <div class="row">
      <div class="field grow">
        <label for="artist">Künstler</label>
        <input id="artist" type="text">
      </div>
      <div class="field year">
        <label for="year">Jahr</label>
        <input id="year" type="text" maxlength="4">
      </div>
    </div>
    <div class="field">
      <label for="tracks">Tracks <small>(einer pro Zeile)</small></label>
      <textarea id="tracks" rows="9"></textarea>
    </div>
    <div class="field">
      <label for="footer">Fußzeile <small>(Label, Spruch, …)</small></label>
      <input id="footer" type="text">
    </div>

    <div class="row">
      <div class="field grow">
        <label for="trackStyle">Tracklist</label>
        <select id="trackStyle">
          <option value="flow">Fließtext</option>
          <option value="list">Liste</option>
        </select>
      </div>
      <div class="field grow">
        <label for="bgMode">Hintergrund</label>
        <select id="bgMode">
          <option value="cream">Creme</option>
          <option value="white">Weiß</option>
          <option value="black">Schwarz</option>
          <option value="coverLight">Cover (hell)</option>
          <option value="cover">Cover</option>
          <option value="coverDark">Cover (dunkel)</option>
          <option value="custom">Eigene Farbe</option>
        </select>
      </div>
      <div class="field color">
        <label for="customBg">&nbsp;</label>
        <input id="customBg" type="color" value="#ecebe6">
      </div>
    </div>

    <div class="field" id="swatchField" hidden>
      <label>Farben aus dem Cover <small>(klicken = Hintergrund)</small></label>
      <div class="swatches" id="swatches"></div>
    </div>

    <label class="check"><input type="checkbox" id="showPalette"> Farbpalette im Poster zeigen</label>

    <div class="row">
      <div class="field grow">
        <label for="size">Format</label>
        <select id="size"></select>
      </div>
      <div class="field grow">
        <label for="dpi">Qualität</label>
        <select id="dpi">
          <option value="300">300 dpi</option>
          <option value="200">200 dpi</option>
          <option value="150">150 dpi</option>
        </select>
      </div>
    </div>

    <div class="row buttons">
      <button id="exportPng" class="primary">PNG</button>
      <button id="exportPdf" class="primary">PDF</button>
    </div>
    <p class="hint" id="hint"></p>
  </aside>

  <main class="stage">
    <canvas id="preview" width="1000" height="1414"></canvas>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
